<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Harjoituslehtyset — Marko Oinas</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:    #2d6a4f;
  --green-l:  #52b788;
  --green-bg: #f0f7f3;
  --sand:     #f7f3ee;
  --sand2:    #ede8e0;
  --sand3:    #c8b99a;
  --ink:      #1a1510;
  --ink2:     #3a3020;
  --ink3:     #7a6a50;
  --amber:    #d4a017;
  --blue:     #3a6a9a;
  --rose:     #b5475a;
  --teal:     #2a7a7a;
  --purple:   #5a4a8a;
  /* Category colors */
  --c-breath: #2d6a9a;
  --c-vagus:  #2d6a4f;
  --c-body:   #8a4a2d;
  --c-image:  #5a4a8a;
  --c-ground: #2a7a5a;
  --c-soma:   #7a4a2d;
  --c-know:   #9a6a2d;
  --c-kids:   #5a7a2d;
}

* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Source Sans 3', system-ui, sans-serif;
  background: linear-gradient(135deg, #e8e4dc 0%, #ddd8ce 100%);
  padding: 2rem; color: var(--ink);
  min-height: 100vh;
}

/* ── SCREEN CONTROLS ── */
.screen-header {
  max-width: 220mm; margin: 0 auto 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
}
.screen-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 1.15rem; font-style: italic; color: var(--ink2);
  letter-spacing: 0.01em;
}
.btn-group { display:flex; gap:0.5rem; flex-wrap:wrap; }
.print-btn {
  font-size: 0.8rem; font-weight: 700;
  padding: 0.5rem 1.2rem; background: var(--green); color: #fff;
  border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s;
  letter-spacing: 0.02em;
}
.print-btn:hover { background: #245a40; transform: translateY(-1px); }
.filter-btn {
  font-size: 0.73rem; font-weight: 600;
  padding: 0.38rem 0.9rem; background: #fff; color: var(--ink2);
  border: 1.5px solid var(--sand3); border-radius: 8px; cursor: pointer; transition: all 0.2s;
}
.filter-btn.active { background: var(--green); color: #fff; border-color: var(--green); }

/* ── A4 PAGE ── */
.a4-page {
  width: 210mm; min-height: 297mm; background: #fff;
  margin: 0 auto 2rem;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
  position: relative; overflow: hidden;
  border-radius: 2px;
}
.a4-page.hidden-page { display: none; }

/* ── PAGE HEADER ── */
.page-header {
  padding: 5mm 10mm 4mm;
  background: var(--green);
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 4mm; flex-shrink: 0;
}
.page-header-clinic {
  font-size: 7.5pt; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: rgba(255,255,255,0.85);
}
.page-header-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 10pt; font-style: italic; color: #fff;
  margin-top: 0.5mm;
}
.page-header-qr img { opacity: 0.9; border-radius: 3px; }

/* ── PAGE BODY ── */
.page-body { flex: 1; padding: 7mm 10mm 6mm; display:flex; flex-direction:column; gap: 5mm; }

/* ── PAGE FOOTER ── */
.page-footer {
  padding: 3mm 10mm;
  background: var(--sand); border-top: 0.3mm solid var(--sand2);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.page-footer-url { font-size: 6.5pt; color: var(--ink3); font-style: italic; }
.page-footer-num { font-size: 6.5pt; color: var(--ink3); font-family: monospace; }

/* ── SECTION HEADER ── */
.section-header {
  display: flex; align-items: center; gap: 3mm;
  padding: 3.5mm 5mm;
  background: var(--green-bg);
  border-left: 3mm solid var(--green);
  border-radius: 0 6px 6px 0;
  margin-bottom: 1mm;
}
.section-icon { font-size: 14pt; line-height: 1; }
.section-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 12pt; font-weight: 700; color: var(--green);
  font-style: italic;
}
.section-sub { font-size: 7.5pt; color: var(--ink3); margin-top: 0.5mm; }

/* ── EXERCISE BLOCK ── */
.ex-block {
  border: 0.3mm solid var(--sand2);
  border-radius: 6px;
  padding: 4mm 5mm;
  background: #fdfcfa;
  position: relative;
  overflow: hidden;
  break-inside: avoid;
}
.ex-block::before {
  content: '';
  position: absolute; top: 0; left: 0; bottom: 0;
  width: 2.5mm;
  background: var(--cat-color, var(--green));
}
.ex-block.compact { padding: 3mm 5mm 3mm 6mm; }

.ex-cat-label {
  font-size: 6pt; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; margin-bottom: 1mm; margin-left: 3mm;
}
.cat-breath { color: var(--c-breath); }
.cat-vagus  { color: var(--c-vagus);  }
.cat-body   { color: var(--c-body);   }
.cat-image  { color: var(--c-image);  }
.cat-ground { color: var(--c-ground); }
.cat-soma   { color: var(--c-soma);   }
.cat-know   { color: var(--c-know);   }
.cat-kids   { color: var(--c-kids);   }

.ex-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 11.5pt; font-weight: 700; color: var(--ink);
  margin-left: 3mm; margin-bottom: 0.5mm;
  line-height: 1.2;
}
.ex-title.small { font-size: 9.5pt; }
.ex-duration {
  font-size: 6.5pt; color: var(--ink3); font-style: italic;
  margin-left: 3mm; margin-bottom: 2mm;
}
.ex-desc {
  font-size: 8pt; color: var(--ink2); line-height: 1.55;
  margin-left: 3mm; margin-bottom: 2.5mm;
}
.ex-desc.story { font-style: italic; color: var(--ink3); }
.steps-label {
  font-size: 6.5pt; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink3);
  margin-left: 3mm; margin-bottom: 1.5mm;
}
.steps-list {
  padding-left: 8mm; font-size: 7.5pt; color: var(--ink);
  line-height: 1.6;
}
.steps-list li { margin-bottom: 0.8mm; }
.ex-tip {
  margin-top: 2.5mm; margin-left: 3mm;
  font-size: 7pt; color: var(--green); font-style: italic;
  padding: 1.5mm 2.5mm; background: var(--green-bg);
  border-radius: 4px; line-height: 1.5;
}
.ex-tip.story-tip { color: var(--purple); background: #f4f0f8; }
.ex-qr {
  text-align: center; flex-shrink: 0;
}
.ex-qr-label { font-size: 5.5pt; color: var(--ink3); margin-top: 1mm; }

/* ── INTRO PAGE ── */
.intro-area {
  flex: 1; padding: 0;
  display: flex; flex-direction: column;
}
.intro-hero {
  background: linear-gradient(135deg, var(--green) 0%, #1a4a30 100%);
  padding: 12mm 10mm 10mm;
  color: #fff;
}
.intro-tagline {
  font-size: 7pt; font-weight: 800; letter-spacing: 0.2em;
  text-transform: uppercase; color: rgba(255,255,255,0.7);
  margin-bottom: 3mm;
}
.intro-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 22pt; font-style: italic; color: #fff;
  line-height: 1.2; margin-bottom: 3mm;
}
.intro-sub { font-size: 9.5pt; color: rgba(255,255,255,0.85); line-height: 1.6; max-width: 120mm; }
.intro-body { padding: 7mm 10mm; flex:1; }
.intro-desc { font-size: 8.5pt; color: var(--ink2); line-height: 1.65; margin-bottom: 6mm; }
.intro-divider {
  border: none; border-top: 0.3mm solid var(--sand2); margin: 5mm 0;
}
.intro-cats { display:flex; flex-direction:column; gap:2mm; }
.intro-cat-row {
  display: flex; align-items: center; gap: 3mm;
  font-size: 8pt;
}
.intro-cat-dot { width:3mm; height:3mm; border-radius:50%; flex-shrink:0; }
.intro-cat-name { font-weight: 700; color: var(--ink2); min-width: 32mm; }
.intro-cat-desc { color: var(--ink3); font-size: 7.5pt; }

/* ── PSYCHOED PAGE ── */
.psychoed-header {
  background: linear-gradient(135deg, #2a5a8a 0%, #1a3a5a 100%);
  padding: 7mm 10mm; color: #fff;
}
.psychoed-label {
  font-size: 6.5pt; font-weight: 800; letter-spacing: 0.18em;
  text-transform: uppercase; color: rgba(255,255,255,0.7); margin-bottom: 2mm;
}
.psychoed-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 16pt; font-style: italic; color: #fff;
}
.psychoed-section { margin-bottom: 4.5mm; }
.psychoed-section-title {
  font-size: 8.5pt; font-weight: 800; color: var(--blue);
  letter-spacing: 0.04em; margin-bottom: 1.5mm;
  padding-bottom: 1mm; border-bottom: 0.3mm solid #d0dce8;
}
.psychoed-text { font-size: 8pt; color: var(--ink2); line-height: 1.65; }
.psychoed-highlight {
  background: #edf3fa; border-left: 2.5mm solid var(--blue);
  padding: 2.5mm 3.5mm; border-radius: 0 4px 4px 0;
  font-size: 7.5pt; color: var(--ink2); line-height: 1.55;
  margin-top: 2mm; font-style: italic;
}

/* ── KIDS PAGES ── */
.kids-hero {
  background: linear-gradient(135deg, #3a7a3a 0%, #2a5a2a 100%);
  padding: 8mm 10mm; color: #fff;
}
.kids-hero-icon { font-size: 24pt; margin-bottom: 2mm; }
.kids-hero-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 16pt; font-style: italic; color: #fff;
}
.kids-hero-sub { font-size: 8.5pt; color: rgba(255,255,255,0.85); margin-top: 1.5mm; }
.kids-age-badge {
  display: inline-block;
  font-size: 7pt; font-weight: 800; letter-spacing: 0.08em;
  padding: 1.5mm 3.5mm; border-radius: 10mm;
  background: var(--green); color: #fff; margin-bottom: 3mm;
}

/* ── PRINT ── */
@media print {
  body { background: none; padding: 0; }
  .screen-header { display: none; }
  .a4-page {
    box-shadow: none; margin: 0; border-radius: 0;
    page-break-after: always;
    width: 100%; min-height: 100vh;
  }
  .hidden-page { display: none !important; }
  .ex-block { break-inside: avoid; }
}
@page { size: A4; margin: 0; }
</style>
</head>

    sub:'Unihygienia · ANS · Käytännön vinkit',
    sections:[
      { heading:'Miksi uni on tärkeää hermostolle?', text:'Uni ei ole vain lepoa — se on aktiivinen prosessi jossa aivot siivoavat kuona-aineita, konsolidoivat muistoja ja palauttavat autonomisen hermoston tasapainoon. Parasympaattinen hermosto dominoi terveessä unessa. Krooninen univaje ylläpitää sympaattista yliaktiviteettia.' },
      { heading:'Stressi ja uni — noidankehä', text:'Stressi aktivoi sympaattisen hermoston ja nostaa kortisoliarvoja — tämä vaikeuttaa nukahtamista. Huono uni puolestaan heikentää stressinsietokykyä seuraavana päivänä. Tämä noidankehä on yleinen, mutta sen voi katkaista.' },
      { heading:'Käytännön keinoja', text:'Säännöllinen nukkumaanmenoaika on tärkein yksittäinen tekijä. Vältä kirkkaita näyttöjä tuntia ennen nukkumista. Viileä makuuhuone (16–19°C) tukee nukahtamista. Fysiologinen huokaus 4–6 kertaa ennen nukkumista laskee vireystilaa nopeasti.' },
      { heading:'Jos heräät yöllä', text:'Älä katso kelloa. Hengitä hitaasti: sisään 4 sekuntia, ulos 6–8 sekuntia. Jos mieli on levoton, kirjoita huolesi paperille ennen nukkumista — se vapauttaa työmuistia. Lämmin suihku tai kylpy 1–2 tuntia ennen nukkumista laskee kehon lämpötilaa ja edistää unta.' },
    ]
  },

  hermosto: {
    icon:'🧠', title:'Autonominen hermosto — kehon säätely',
    sub:'ANS · Sympaattinen · Parasympaattinen · Vagushermo',
    sections:[
      { heading:'Kaksi järjestelmää', text:'Autonominen hermosto (ANS) säätelee kaikkea mitä tapahtuu tietoisuutesi ulkopuolella: sydämen lyönnit, hengitys, ruoansulatus, verenpaine. Se jakautuu sympaattiseen (aktivointi, kaasupoljin) ja parasympaattiseen (rauhoittaminen, jarru) järjestelmään.' },
      { heading:'Sympaattinen hermosto', text:'Aktivoituu uhkan, stressin tai haasteen edessä. Sydän lyö nopeammin, hengitys tihenee, lihakset jännittyvät, adrenaliini ja kortisoli vapautuvat. Tämä on tarkoituksellinen selviytymismekanismi — ongelma syntyy kun se on päällä liian kauan.' },
      { heading:'Vagushermo — rauhoittumisen kaapeli', text:'Vagushermo on parasympaattisen hermoston tärkein reitti. Se kulkee aivorungosta sydämeen, keuhkoihin ja suolistoon. Aktivoit sen suoraan: hidas uloshengitys, hyräily, kylmä vesi kasvoille, sosiaalinen yhteys. Korkea vagaalitonus = hyvä stressinsietokyky.' },
      { heading:'Harjoitteet ja ANS', text:'Kaikki tässä lehtisessä olevat harjoitteet vaikuttavat ANS:ään. Hengitysharjoitteet aktivoivat vagushermon suoraan. Kehotietoisuus auttaa tunnistamaan oman vireystilan. Somaattiset harjoitteet purkavat kehoon jäänyttä sympaattista jännitystä.' },
    ]
  },

  hengitys: {
    icon:'💨', title:'Hengitys — hermostosi nopein säätökeino',
    sub:'Fysiologia · Tekniikka · Käytäntö',
    sections:[
      { heading:'Miksi hengitys toimii?', text:'Hengitys on ainoa autonominen toiminto jonka voit ottaa tahdonalaiseen kontrolliisi. Hidastamalla uloshengitystä aktivoit parasympaattisen hermoston suoraan vagushermon kautta. Tämä laskee sykettä, verenpainetta ja vireystilaa sekunneissa.' },
      { heading:'Sisään- vs. uloshengitys', text:'Sisäänhengitys aktivoi sympaattisen hermoston — sydän lyö hieman nopeammin. Uloshengitys aktivoi parasympaattisen — sydän hidastuu. Siksi pidennetty uloshengitys rauhoittaa: hengitä sisään 4 sekuntia, ulos 6–8 sekuntia. Suhde on ratkaiseva, ei kesto itsessään.' },
      { heading:'Fysiologinen huokaus', text:'Nopein tapa laskea stressiä: hengitä sisään nenän kautta, sitten pieni lisähenkäinen joka täyttää keuhkot kokonaan, sitten pitkä hidas uloshengitys suun kautta. Tämä tyhjentää keuhkorakkuloihin jääneen ilman ja nollaa hengityskeskuksen. Tutkitusti tehokkain yksittäinen tekniikka.' },
      { heading:'Säännöllinen harjoittelu', text:'5 minuuttia päivässä riittää. Tärkeintä on säännöllisyys — harjoittelet hermoston säätelyä kuten lihaskuntoakin. Ajan myötä parasympaattinen järjestelmä aktivoituu helpommin ja vireystila tasapainottuu arjessa automaattisesti.' },
    ]
  },
};


let qrPageCount = 0;

function header(qrId) {
  return `
    <div class="page-header">
      <div>
        <div class="page-header-clinic">${THERAPIST.name} · ${THERAPIST.clinic||'Turun Fysiokulma'}</div>
        <div class="page-header-title">Psykofyysiset harjoitteet</div>
      </div>
      <div class="page-header-qr" id="${qrId}"></div>
    </div>`;
}

function footer(pageNum) {
  return `
    <div class="page-footer">
      <div class="page-footer-url">${THERAPIST.email} · Oma harjoittelutyökalu: markooinas-source.github.io/stressijarjestelma/asiakas.html</div>
      <div class="page-footer-num">${pageNum}</div>
    </div>`;
}

function footer(pageNum, total) {
  return `
    <div class="page-footer">
      <div class="footer-url">${QR_URL}</div>
      <div class="footer-page">Sivu ${pageNum} / ${total}</div>
    </div>`;
}

function qrImg(url, size=48) {
  // QR-koodi Google Charts API:lla
  const encoded = encodeURIComponent(url);
  return `<img src="https://chart.googleapis.com/chart?cht=qr&chs=${size}x${size}&chl=${encoded}&choe=UTF-8" width="${size}" height="${size}" style="display:block">`;
}

const APP_URL = 'https://markooinas-source.github.io/stressijarjestelma/asiakas.html';

function exBlock(ex, compact) {
  const cls = compact ? 'ex-block compact' : 'ex-block';
  const titleCls = compact ? 'ex-title small' : 'ex-title';
  const stepsHTML = ex.steps.map(s => `<li>${s}</li>`).join('');
  const isStory = ex.cat && (ex.cat.includes('satu') || ex.cat.includes('Satu') || ex.cat.includes('matka'));
  const descCls = isStory ? 'ex-desc story' : 'ex-desc';
  const tipCls  = isStory ? 'ex-tip story-tip' : 'ex-tip';

  // Category color for left border
  const catColorMap = {
    breath:'var(--c-breath)', vagus:'var(--c-vagus)', body:'var(--c-body)',
    image:'var(--c-image)', ground:'var(--c-ground)', somatic:'var(--c-soma)',
    bi:'var(--c-know)', cognitive:'var(--c-know)', kids:'var(--c-kids)'
  };
  const borderColor = catColorMap[ex.cat] || 'var(--green)';

  return `
    <div class="${cls}" style="--cat-color:${borderColor}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div class="ex-cat-label ${ex.catClass||'cat-ground'}">${ex.catLabel||ex.cat}</div>
          <div class="${titleCls}">${ex.name}</div>
          <div class="ex-duration">${ex.dur}</div>
        </div>
        <div class="ex-qr" style="margin-left:3mm;flex-shrink:0">
          ${qrImg(APP_URL, 36)}
          <div class="ex-qr-label">Avaa sovellus</div>
        </div>
      </div>
      <div class="${descCls}">${ex.desc}</div>
      <div class="steps-label">Ohje vaiheittain</div>
      <ol class="steps-list">${stepsHTML}</ol>
      <div class="${tipCls}">${ex.tip}</div>
    </div>`;
}

function kidsBlock(ex, compact) {
  const stepsHTML = ex.steps.map(s => `<li>${s}</li>`).join('');
  const isStory = ex.cat && (ex.cat.toLowerCase().includes('satu') || ex.cat.toLowerCase().includes('mielikuva') || ex.cat.toLowerCase().includes('matka'));
  const descCls = isStory ? 'ex-desc story' : 'ex-desc';
  const tipCls = isStory ? 'ex-tip story-tip' : 'ex-tip';
  return `
    <div class="ex-block${compact?' compact':''}">
      <div>
        <span style="font-size:12pt">${ex.emoji}</span>
        <span class="story-badge">${ex.cat}</span>
        <span class="age-badge">${ex.age}</span>
        <div class="ex-title small" style="margin-top:1mm">${ex.name}</div>
      </div>
      <div class="${descCls}">${ex.desc}</div>
      <div class="steps-label">Ohje vaiheittain</div>
      <ol class="steps-list">${stepsHTML}</ol>
      <div class="${tipCls}">${ex.tip}</div>
    </div>`;
}

function buildPages() {
  const container = document.getElementById('pages-container');
  const total = PAGES.length;

  PAGES.forEach((pageDef, pi) => {
    const page = document.createElement('div');
    page.className = 'a4-page';
    page.dataset.audience = pageDef.type === 'psychoed' ? 'psychoed' : pageDef.audience;
    const qrId = `qr-p${pi}`;
    const pageNum = pi + 1;

    if (pageDef.type === 'intro') {
      page.innerHTML = header(qrId) + `
        <div class="intro-area">
          <div class="intro-hero">
            <div class="intro-tagline">Turun Fysiokulma · Psykofyysinen terapia</div>
            <div class="intro-title">Psykofyysiset harjoitteet</div>
            <div class="intro-sub">Tämä lehtinen sisältää harjoitteet joita terapiassasi käytetään. Harjoitteet rauhoittavat hermostoa, kehittävät kehotietoisuutta ja tukevat arjen stressinhallintaa.</div>
          </div>
          <div class="intro-body">
            <div class="intro-desc">Harjoittele säännöllisesti — myös silloin kun olo on hyvä. Hermosto oppii säätelyä toiston kautta. Pienikin päivittäinen harjoittelu on tehokkaampaa kuin suuri satunnainen.</div>
            <hr class="intro-divider">
            <div class="intro-cats">
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-breath)"></div><div class="intro-cat-name">😮‍💨 Hengitys</div><div class="intro-cat-desc">Aktivoi parasympaattisen hermoston. Suorin tapa vaikuttaa stressireaktioon.</div></div>
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-ground)"></div><div class="intro-cat-name">🌍 Ankkurointi</div><div class="intro-cat-desc">Palauttaa nykyhetkeen. Erityisen hyvä ahdistukseen ja mielen pyörimiseen.</div></div>
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-vagus)"></div><div class="intro-cat-name">🎵 Vagus & rauhoittava</div><div class="intro-cat-desc">Aktivoi vagushermon suoraan — ääni, kylmä, hengityksen rytmi.</div></div>
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-body)"></div><div class="intro-cat-name">🧘 Kehollinen</div><div class="intro-cat-desc">Kehotietoisuus, jännityksen tunnistaminen ja vapauttaminen.</div></div>
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-soma)"></div><div class="intro-cat-name">⚡ Somaattinen</div><div class="intro-cat-desc">Kehon luonnollinen tapa purkaa jännitystä — ravistelu, liike, vapina.</div></div>
              <div class="intro-cat-row"><div class="intro-cat-dot" style="background:var(--c-image)"></div><div class="intro-cat-name">💚 Mielikuva</div><div class="intro-cat-desc">Mielikuvat aktivoivat samat aivoalueet kuin todelliset kokemukset.</div></div>
            </div>
            <hr class="intro-divider">
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3mm">
              <div style="background:var(--green-bg);border-radius:5px;padding:3mm;text-align:center">
                <div style="font-size:11pt;margin-bottom:1mm">🐣</div>
                <div style="font-size:7pt;font-weight:700;color:var(--green)">3–7-vuotiaat</div>
                <div style="font-size:6.5pt;color:var(--ink3);margin-top:1mm">Satu- ja leikkimuotoiset</div>
              </div>
              <div style="background:var(--green-bg);border-radius:5px;padding:3mm;text-align:center">
                <div style="font-size:11pt;margin-bottom:1mm">🌱</div>
                <div style="font-size:7pt;font-weight:700;color:var(--green)">8–12-vuotiaat</div>
                <div style="font-size:6.5pt;color:var(--ink3);margin-top:1mm">Metaforat ja tarinat</div>
              </div>
              <div style="background:var(--green-bg);border-radius:5px;padding:3mm;text-align:center">
                <div style="font-size:11pt;margin-bottom:1mm">🌿</div>
                <div style="font-size:7pt;font-weight:700;color:var(--green)">13–17-vuotiaat</div>
                <div style="font-size:6.5pt;color:var(--ink3);margin-top:1mm">Syvemmät harjoitteet</div>
              </div>
            </div>
          </div>
        </div>
      ` + footer(pageNum);

    } else if (pageDef.type === 'exercises') {
      const exs = pageDef.exercises.map(i => EXERCISES[i]).filter(Boolean);
      const blocksHTML = exs.map(ex => exBlock(ex, exs.length > 2)).join('');
      page.innerHTML = header(qrId) + `
        <div class="page-body">
          <div class="section-header">
            <div class="section-icon">${pageDef.section.icon}</div>
            <div>
              <div class="section-title">${pageDef.section.title}</div>
              <div class="section-sub">${pageDef.section.sub}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4mm">${blocksHTML}</div>
        </div>
      ` + footer(pageNum);

    } else if (pageDef.type === 'psychoed') {
      const pd = PSYCHOED[pageDef.topic];
      if (!pd) { container.appendChild(page); return; }
      const sectionsHTML = pd.sections.map(s => `
        <div class="psychoed-section">
          <div class="psychoed-section-title">${s.heading}</div>
          ${s.text ? `<div class="psychoed-text">${s.text}</div>` : ''}
          ${s.highlight ? `<div class="psychoed-highlight">${s.highlight}</div>` : ''}
          ${s.items ? `<ul style="margin:2mm 0 0 4mm;display:flex;flex-direction:column;gap:1.5mm">${s.items.map(i=>`<li style="font-size:7.5pt;color:var(--ink2);line-height:1.55">${i}</li>`).join('')}</ul>` : ''}
        </div>`).join('');
      page.innerHTML = header(qrId) + `
        <div class="psychoed-header">
          <div class="psychoed-label">Tietoa sinulle · ${pd.sub}</div>
          <div class="psychoed-title">${pd.icon} ${pd.title}</div>
        </div>
        <div class="page-body">${sectionsHTML}</div>
      ` + footer(pageNum);
    } else if (pageDef.type === 'kids-intro') {
      page.innerHTML = header(qrId) + `
        <div class="section-banner">
          <span class="section-icon">🧸</span>
          <div><div class="section-title">Lasten ja nuorten harjoitteet</div><div class="section-sub">Satumuotoiset · Ikätasoiset · Kehollinen oppiminen</div></div>
        </div>
        <div class="intro-area">
          <div class="intro-sub">Lasten harjoitteet on suunniteltu ikätasoisesti sadun, leikin ja mielikuvien kautta. Lapset uppoutuvat mielikuviin helpommin kuin aikuiset — tämä on kliininen vahvuus, ei heikkous.</div>
          <div class="intro-divider"></div>
          <div class="intro-age-grid">
            <div class="intro-age-card" style="border-color:#d0e8f0;background:#e8f4f8">
              <div class="intro-age-head" style="color:#1a5070">🐣 3–7-vuotiaat</div>
              <div class="intro-age-list" style="color:#2a6080">Kaikki harjoitteet sadun muodossa. Vanhempi tai terapeutti kertoo tarinan rauhallisesti. Harjoite voidaan tehdä yhdessä, esimerkiksi Perhoshalussa terapeutti taputtaa lapsen hartioita.</div>
            </div>
            <div class="intro-age-card" style="border-color:#d8f0d0;background:#edf7e8">
              <div class="intro-age-head" style="color:#2a5020">🌱 8–12-vuotiaat</div>
              <div class="intro-age-list" style="color:#3a6030">Metaforat ja tarinat joissa lapsi on itse toimija — agentti, puu, aalto. Harjoitteet toimivat itsenäisesti tai ohjatusti. Kesto 5–10 minuuttia.</div>
            </div>
            <div class="intro-age-card" style="border-color:#e8d8f0;background:#f4eef8">
              <div class="intro-age-head" style="color:#4a2070">🌿 13–17-vuotiaat</div>
              <div class="intro-age-list" style="color:#5a3080">Syvemmät mielikuvamatkat ja kehotietoisuusharjoitteet. Lähes aikuisten tason harjoitteet mutta nuoren kokemusmaailmaan sovitettuina. Voidaan tehdä itsenäisesti.</div>
            </div>
          </div>
          <div class="intro-divider"></div>
          <div style="font-size:8pt;color:#4a3e30;line-height:1.65">
            <strong>Ohjeet vanhemmalle / terapeutille:</strong> Lue harjoitteen ohjeet ennen kuin aloitat. Puhu rauhallisesti, hitaasti. Anna lapselle aikaa — älä kiirehdi. Harjoitteet voidaan toistaa useita kertoja. Lapsen reaktio (nauru, liikehtiminen) on normaalia — se ei tarkoita ettei harjoite toimi.
          </div>
        </div>
      ` + footer(pageNum, total);

    } else if (pageDef.type === 'kids-exercises') {
      const exs = pageDef.exercises.map(i => KIDS_EXERCISES[i]).filter(Boolean);
      const cols = exs.length >= 3 ? 'exercises-area-3col' : 'exercises-area';
      const compact = exs.length >= 3;
      const blocksHTML = exs.map(ex => kidsBlock(ex, compact)).join('');
      page.innerHTML = header(qrId) + `
        <div class="section-banner">
          <span class="section-icon">${pageDef.label.split(' ')[0]}</span>
          <div><div class="section-title">${pageDef.label}</div><div class="section-sub">${pageDef.sub}</div></div>
        </div>
        <div class="${cols}">${blocksHTML}</div>
      ` + footer(pageNum, total);
    }

    container.appendChild(page);
  });

  // QR codes
  requestAnimationFrame(() => {
    PAGES.forEach((_, pi) => {
      const el = document.getElementById(`qr-p${pi}`);
      if (el && typeof QRCode !== 'undefined') {
        try {
          new QRCode(el, { text:QR_URL, width:68, height:68, colorDark:'#1a1510', colorLight:'#ffffff', correctLevel:QRCode.CorrectLevel.M });
        } catch(e) { el.innerHTML='<div style="font-size:5pt;color:#8a7e6e;text-align:center">QR</div>'; }
      }
    });
  });
}

function filterPages(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.a4-page').forEach(page => {
    const aud = page.dataset.audience;
    if (type === 'all') page.classList.remove('hidden-page');
    else if (type === 'adults') page.classList.toggle('hidden-page', aud === 'kids' || aud === 'psychoed');
    else if (type === 'kids') page.classList.toggle('hidden-page', aud !== 'kids');
    else if (type === 'psychoed') page.classList.toggle('hidden-page', aud !== 'psychoed');
  });
}

document.addEventListener('DOMContentLoaded', buildPages);
</script>
</body>
</html>
